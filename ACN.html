<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Xena's Music Corner</title>
		
		<link rel="icon" type="image/x-icon" href=
		"./images/logo_limited_expanded_no-background.png">
		
		<link rel="shortcut icon" type="image/x-icon" href=
		"./images/logo_limited_expanded_no-background.png">

		<!--Make sure site scales properly-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<!--links to several recources-->
		<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bungee+Outline">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		
		<!--Stylesheet-->
		<link rel="stylesheet" href="acnh_style.css">
	</head>
	
	<body>
		<main>
			<h2>Animal Crossing: New Horizons</h2>
			<h3>Villager Hunt Helper</h3></br>
			<form>
				<label for="Habitants"><i>(enter a number between 2 and 9)</i></br>
					There are </label>
				<input id="Habitants" name="Habitants" type="text" value="9">
				<label for="Habitants"> villagers on my island.</label>
				</br></br>
				<label for="Hotel"><i>(enter a number between 0 and 5)</i></br>
					There are </label>
				<input id="Hotel" name="Hotel" type="text" value="5">
				<label for="Hotel"> guests staying at my hotel...</label>
				</br></br>
				<label for="Hotel-02"><i>(enter a number between 0 and 5)</i></br>
					... Of which I want </label>
				<input id="Hotel-02" name="Hotel-02" type="text" value="0">
				<label for="Hotel-02"> to live on my island.</label>
				</br></br>
				<label for="Looking"><i>(enter a number between 1 and 408)</i></br>
					I have </label>
				<input id="Looking" name="Looking" type="text" value="5">
				<label for="Looking"> specific villagers I'm looking for.</label>
				</br></br>
				<label for="Camper">There is a villager staying on my campsite.</label><br>
				<input class="checkbox" id="Camper" name="Camper" type="checkbox" value="Camper">
				</br></br>
			</form>
		</main>
	</body>
</html>
